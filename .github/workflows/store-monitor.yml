name: Scheduled Store Monitor (Scrapling)

on:
  schedule:
    - cron: "4,22,40,58 * * * *"
  workflow_dispatch:

jobs:
  scrapling-store-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Check CRON_SECRET configuration
        id: config
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CRON_SECRET secret is not configured; skipping Scrapling store check."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-scrapling.txt

      - name: Install Scrapling dependencies
        if: steps.config.outputs.enabled == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-scrapling.txt

      - name: Cache Scrapling browser binaries
        if: steps.config.outputs.enabled == 'true'
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('scripts/requirements-scrapling.txt') }}

      - name: Install Scrapling Chromium binaries
        if: steps.config.outputs.enabled == 'true' && steps.browser-cache.outputs.cache-hit != 'true'
        run: scrapling install

      - name: Install OS runtime deps for Chromium
        if: steps.config.outputs.enabled == 'true'
        run: python -m playwright install-deps chromium

      - name: Run Scrapling store verification and sync to Worker
        if: steps.config.outputs.enabled == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PUBLIC_ORIGIN: https://everfall-limited-watcher.itschase.workers.dev
          WORKER_CRON_URL: https://everfall-limited-watcher.itschase.workers.dev/cron
        run: python scripts/scrapling_monitor.py
