name = "everfall-limited-watcher"
account_id = "<YOUR_CLOUDFLARE_ACCOUNT_ID>"
workers_dev = true
compatibility_date = "2024-08-01"

[vars]
# No plain vars needed; secrets are stored via wrangler secret put.

[triggers]
# Run scraper every 15 minutes
cron = "*/15 * * * *"

[[kv_namespaces]]
binding = "DISCORD_BOT"
id = "<YOUR_KV_NAMESPACE_ID>"
