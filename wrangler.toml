name = "everfall-limited-watcher"
main = "src/index.ts"
compatibility_date = "2024-11-01"
keep_vars = true

# Single source of truth for Cloudflare Workers deployment + Vite SPA static assets
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Production environment (deployed on push to master / main)
# NOTE: Never place secret values (DISCORD_CLIENT_SECRET, DISCORD_BOT_TOKEN, CRON_SECRET) in this file.
[vars]
DISCORD_APPLICATION_ID = "1571958001928245378"
DISCORD_CLIENT_ID = "1571958001928245378"
DISCORD_PUBLIC_KEY = "b143dc5acc60aff5f7a95169189f10e36fcc3cddb288ee8b3849a22b5c2af1d9"
DISCORD_PRIMARY_ADMINISTRATOR = "151037568484507648"
PUBLIC_ORIGIN = "https://everfall-limited-watcher.itschase.workers.dev"

# Native CF scheduled triggers hit Tebex's Bot Challenge (403); automated checks run every 7m via GitHub Actions (store-monitor.yml + Scrapling) posting to POST /cron.
[triggers]
crons = []

[[kv_namespaces]]
binding = "DISCORD_BOT"
id = "41d8c9dce7f34af28156a5a0d3233bfb"

[[d1_databases]]
binding = "DB"
database_name = "everfall-watcher-db"
database_id = "49595553-38c4-4bdc-ae7a-17172d668987"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "everfall-media"

[observability.logs]
enabled = true
invocation_logs = true

# Staging environment (deployed on push to staging branch)
# Configure staging secrets in Cloudflare Dashboard for everfall-limited-watcher-staging
# and provision dedicated staging KV, D1, and R2 resources so staging never touches production state.
[env.staging]
name = "everfall-limited-watcher-staging"

[env.staging.vars]
DISCORD_APPLICATION_ID = "1571958001928245378"
DISCORD_CLIENT_ID = "1571958001928245378"
DISCORD_PUBLIC_KEY = "b143dc5acc60aff5f7a95169189f10e36fcc3cddb288ee8b3849a22b5c2af1d9"
DISCORD_PRIMARY_ADMINISTRATOR = "151037568484507648"
PUBLIC_ORIGIN = "https://everfall-limited-watcher-staging.itschase.workers.dev"

[env.staging.triggers]
crons = []

[[env.staging.kv_namespaces]]
binding = "DISCORD_BOT"
id = "REPLACE_WITH_STAGING_KV_NAMESPACE_ID"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "everfall-watcher-staging-db"
database_id = "037f2bc1-cce9-49df-85b2-72e70769e6ef"

[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "everfall-media-staging"
